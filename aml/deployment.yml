# aml/deployment.yml
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue # A name for this specific deployment (e.g., for blue-green testing)
endpoint_name: churn-prediction-endpoint # Must match the name in endpoint.yml

# Reference to the model that will be registered by your training job
# The 'latest' version will be automatically used by the pipeline
model: azureml:churn-prediction-model@latest

# Code and environment for the scoring script
code_configuration:
  code: ../src
  scoring_script: score.py # Your scoring script
environment: azureml:AzureML-sklearn-1.0-ubuntu20.04-py38-cpu@latest

# The virtual machine size for the endpoint
instance_type: Standard_DS3_v2
instance_count: 1